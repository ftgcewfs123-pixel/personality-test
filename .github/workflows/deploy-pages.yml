name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 将 personality-test 发布到 gh-pages 根目录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -a personality-test/. "$WORK/"
          cd "$WORK"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "部署生活氛围人格测试"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: 尝试开启 GitHub Pages（来源为 gh-pages 根目录）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "查询 Pages 状态: ${CODE}"
          if [ "$CODE" = "200" ]; then
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
            -X POST \
            -H "$AUTH" -H "$ACCEPT" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "创建 Pages 站点: ${CODE}"
          python3 - << 'PY'
          import json
          for name in ("/tmp/pages.json", "/tmp/pages-create.json"):
              try:
                  data = json.load(open(name))
              except Exception:
                  continue
              print(name, {k: data.get(k) for k in ("message", "html_url", "status", "build_type")})
          PY
          exit 0
